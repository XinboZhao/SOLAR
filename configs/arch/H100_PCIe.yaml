name: "H100_PCIe"
SRAM_capacity: 52428800  # 50MB
SRAM_byte_per_cycle: 10000  # 20TB/s
DRAM_capacity: 85899345920  # 80GB
DRAM_byte_per_cycle: 1019.4  # 2TB/s  
freq_GHz: 2  # base clock frequency 
MAC_per_cycle_fp32_sm: 12025  # 48.1 TFLOPS baseline full-precision performance
# Dense Tensor Core throughput in MAC/cycle. One MAC is two operations, so
# peak FLOPS/OPS = MAC_per_cycle * freq_GHz * 2. NVIDIA's 2:4 structured
# sparsity figures are 2x these values and must not be used for dense workloads.
MAC_per_cycle_int8_tc: 378000  # 1.512 dense POPS
MAC_per_cycle_fp8_tc: 378000  # 1.512 dense PFLOPS
MAC_per_cycle_fp16_tc: 189000  # 0.756 dense PFLOPS
MAC_per_cycle_bf16_tc: 189000  # 0.756 dense PFLOPS
MAC_per_cycle_tf32_tc: 94500  # 0.378 dense PFLOPS
